# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Tag automatique sur tous les WeatherProviderInterface pour injection dans CollectForecastsCommand
    _instanceof:
        App\Weather\WeatherProviderInterface:
            tags: ['app.weather_provider']

    App\Command\CollectForecastsCommand:
        arguments:
            $providers: !tagged_iterator app.weather_provider

    # Injection des clés API pour les services météo nécessitant une authentification
    App\Weather\Provider\OpenWeatherMapService:
        arguments:
            $apiKey: '%env(OPENWEATHERMAP_API_KEY)%'

    App\Weather\Provider\VisualCrossingService:
        arguments:
            $apiKey: '%env(VISUAL_CROSSING_API_KEY)%'

    App\Weather\Provider\WeatherApiService:
        arguments:
            $apiKey: '%env(WEATHERAPI_KEY)%'

    App\Weather\Provider\MeteoFranceService:
        arguments:
            $apiKey: '%env(METEOFRANCE_API_KEY)%'

    App\Weather\Provider\InfoclimatService:
        arguments:
            $apiKey: '%env(INFOCLIMAT_API_KEY)%'
            $apiSecret: '%env(INFOCLIMAT_API_SECRET)%'
